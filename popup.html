<!DOCTYPE html>
<html>
<head>
  <title>Manipulation Identifier</title>
  <meta charset="UTF-8">
  <style>
    :root {
      --min-width: 320px;
      --min-height: 400px;
      --max-width: 600px;
      --max-height: 800px;
    }

    html {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      min-width: var(--min-width);
      min-height: var(--min-height);
      max-width: var(--max-width);
      max-height: var(--max-height);
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #333;
      background-color: #fff;
      resize: both;
      overflow: hidden;
    }

    .container {
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .header {
      padding: 15px 15px 0;
      background: #fff;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .content {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
    }

    .content::-webkit-scrollbar {
      width: 8px;
    }

    .content::-webkit-scrollbar-track {
      background: #f1f1f1;
      border-radius: 4px;
    }

    .content::-webkit-scrollbar-thumb {
      background: #888;
      border-radius: 4px;
    }

    .content::-webkit-scrollbar-thumb:hover {
      background: #555;
    }

    h1 {
      font-size: 18px;
      margin: 0 0 15px 0;
      color: #1a73e8;
      text-align: center;
    }

    h3 {
      font-size: 16px;
      margin: 20px 0 10px;
      color: #1a73e8;
    }

    .analyze-button {
      background-color: #1a73e8;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 12px 16px;
      font-size: 14px;
      cursor: pointer;
      width: 100%;
      margin-bottom: 15px;
      transition: background-color 0.2s;
    }

    .analyze-button:hover {
      background-color: #185abc;
    }

    .analyze-button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }

    .status {
      font-size: 12px;
      color: #666;
      text-align: center;
      margin-bottom: 10px;
    }

    .results-container {
      margin-bottom: 20px;
    }

    .results-summary {
      font-size: 13px;
      margin-bottom: 12px;
      text-align: center;
    }

    .tactic-item {
      background-color: #fff3cd;
      border: 1px solid #ffeaa7;
      border-radius: 4px;
      padding: 15px;
      margin-bottom: 15px;
    }

    .tactic-title {
      font-weight: bold;
      margin-bottom: 8px;
      color: #856404;
      font-size: 14px;
    }

    .tactic-description {
      font-size: 13px;
      color: #666;
      margin-bottom: 8px;
      line-height: 1.4;
    }

    .tactic-examples {
      font-size: 12px;
      color: #888;
      font-style: italic;
      line-height: 1.4;
    }

    .no-results {
      text-align: center;
      color: #28a745;
      font-size: 14px;
      font-weight: 500;
      padding: 15px;
      background-color: #d4edda;
      border-radius: 4px;
      margin: 15px 0;
    }

    .initial-state {
      text-align: center;
      color: #6c757d;
      font-size: 14px;
      padding: 15px;
      background-color: #f8f9fa;
      border: 1px solid #e9ecef;
      border-radius: 4px;
      margin: 15px 0;
    }

    .error {
      color: #dc3545;
      font-size: 12px;
      text-align: center;
      background-color: #f8d7da;
      border: 1px solid #f5c6cb;
      border-radius: 4px;
      padding: 8px;
      margin-bottom: 10px;
    }

    .loading {
      text-align: center;
      color: #6c757d;
    }

    .loading::after {
      content: "";
      animation: dots 1.5s steps(5, end) infinite;
    }

    #llmResponse {
      background-color: #f8f9fa;
      border: 1px solid #e9ecef;
      border-radius: 4px;
      padding: 15px;
      color: #444;
      font-size: 13px;
      line-height: 1.5;
    }

    .llm-paragraph {
      margin-bottom: 12px;
    }

    .llm-tactic {
      margin: 15px 0;
      padding-left: 15px;
      border-left: 3px solid #1a73e8;
    }

    @keyframes dots {
      0%, 20% {
        color: rgba(0,0,0,0);
        text-shadow:
          .25em 0 0 rgba(0,0,0,0),
          .5em 0 0 rgba(0,0,0,0);
      }
      40% {
        color: #6c757d;
        text-shadow:
          .25em 0 0 rgba(0,0,0,0),
          .5em 0 0 rgba(0,0,0,0);
      }
      60% {
        text-shadow:
          .25em 0 0 #6c757d,
          .5em 0 0 rgba(0,0,0,0);
      }
      80%, 100% {
        text-shadow:
          .25em 0 0 #6c757d,
          .5em 0 0 #6c757d;
      }
    }

    .resize-handle {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 15px;
      height: 15px;
      cursor: se-resize;
      background: linear-gradient(135deg, transparent 50%, #1a73e8 50%);
      border-radius: 0 0 4px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Manipulation Identifier</h1>
      <button id="analyzeButton" class="analyze-button">
        Analyze Current Page
      </button>
      <div id="status" class="status"></div>
    </div>

    <div class="content">
      <div id="results" class="results-container">
        <div id="resultsSummary" class="results-summary"></div>
        <div id="resultsContent"></div>
      </div>
      <div id="llmResponse"></div>
    </div>
  </div>
  <div class="resize-handle"></div>

  <script src="popup.js"></script>
</body>
</html>
