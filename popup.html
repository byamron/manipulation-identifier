<!DOCTYPE html>
<html>
<head>
  <title>Manipulation Identifier</title>
  <meta charset="UTF-8">
  <style>
    :root {
      --min-width: 300px;
      --min-height: 150px;
    }

    html {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      min-width: var(--min-width);
      min-height: var(--min-height);
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #333;
      background-color: #fff;
    }

    .container {
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 15px;
    }

    .header {
      text-align: center;
      margin-bottom: 15px;
      position: relative;
    }

    .close-button {
      position: absolute;
      top: 0;
      right: 0;
      background: none;
      border: none;
      font-size: 20px;
      color: #666;
      cursor: pointer;
      padding: 0;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
    }

    .close-button:hover {
      background-color: #f0f0f0;
      color: #333;
    }

    h1 {
      font-size: 18px;
      margin: 0 0 15px 0;
      color: #1a73e8;
    }

    .analyze-button {
      background-color: #1a73e8;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 12px 16px;
      font-size: 14px;
      cursor: pointer;
      width: 100%;
      transition: background-color 0.2s;
    }

    .analyze-button:hover {
      background-color: #185abc;
    }

    .analyze-button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }

    .analyze-button.active {
      background-color: #dc3545;
    }

    .analyze-button.active:hover {
      background-color: #c82333;
    }

    .status {
      margin-top: 10px;
      text-align: center;
    }

    .status-message {
      color: #666;
      font-size: 13px;
      line-height: 1.4;
      padding: 8px;
      border-radius: 4px;
      background-color: #f8f9fa;
      border: 1px solid #e9ecef;
    }

    .status-message.loading {
      color: #6c757d;
    }

    .error {
      color: #dc3545;
      font-size: 12px;
      margin-top: 10px;
      padding: 8px;
      border-radius: 4px;
      background-color: #f8d7da;
      border: 1px solid #f5c6cb;
    }

    .loading {
      color: #6c757d;
      font-size: 12px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <button class="close-button" id="closeButton" title="Close">×</button>
      <h1>Manipulation Identifier</h1>
      <button id="analyzeButton" class="analyze-button">
        Analyze Current Page
      </button>
      <div id="status" class="status"></div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
