<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manipulation Identifier</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <!-- Controls -->
  <div class="controls">
    <div class="controls-row">
      <select id="modelSelect" class="model-select" aria-label="Select AI model">
        <option value="gemini-2.5-flash">Flash 2.5 (Recommended)</option>
        <option value="gemini-2.5-flash-lite">Flash Lite 2.5 (Faster)</option>
      </select>
      <button class="btn-settings" id="settingsBtn" title="Settings" aria-label="Open settings">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </div>
    <button id="analyzeBtn" class="btn-analyze">Analyze</button>
    <div id="actionRow" class="controls-action-row" style="display: none;">
      <button id="clearBtn" class="btn-analyze btn-clear">Clear</button>
      <button id="rerunBtn" class="btn-analyze">Re-run</button>
    </div>
  </div>

  <!-- Status area (for loading, errors, etc.) -->
  <div id="statusArea" class="status-area" aria-live="polite"></div>

  <!-- Results area -->
  <div id="resultsArea" class="results-area"></div>

  <script src="shared.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
